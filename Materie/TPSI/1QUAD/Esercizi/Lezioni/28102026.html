<!DOCTYPE html>
    <!-- 
    Esercitazione proposta
    Crea un file di archivio JSON per catalogare ipotetiche auto usate di un losco rivenditore. Ogni autovettura è archiviata secondo le seguenti chiavi:
    - Marca
    - Modello
    - Anno Immatricolazione
    - Provincia
    - Uniproprietario
    - Kilometraggio

    Una volta creato un archivio con una decina di autovetture, con dati diversi ed inventati, procedere alla creazione di una pagina HTML che grazie a funzioni Javascript permetta le seguenti operazioni:
    - Visualizzazione intero archivio.
    - Visualizzazione autovetture uniproprietario.
    - Ricerca e visualizzazione autovetture secondo la Provincia.
    - Ricerca e visualizzazione autovetture di una determinata marca.
    - Ricerca e visualizzazione di autovetture con immatricolazione compresa tra anno_x e anno_y.

    Predisporre un'interfaccia grafica con bottoni e caselle di testo, indicando quali valori richiedono/a cosa servono.
    Applicare il framework Bootstrap dall'inizio o, eventualmente, sviluppare una versione funzionante base e applicarlo in un secondo momento su una copia/duplicato della versione di base.
    -->
    <html>
    <head>
        <title>AUTO USATE</title>
        <meta charset="utf-8">
        <!-- parte richiesta dal framework Bootstrap -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <button id="CaricaJSON">Carica Intera Lista</button>
        <button id="btnCaricaMaschi">Carica Utenti Maschi</button>
        <br /><br />
        Et&agrave; minima: <input type="text" id="anniRichiesti"><button id="btnEtaMinima">Et&agrave; maggiore o uguale di...</button>
        <br /><br />
        <div id="viewBox"></div>
        <br /><br />
        <!-- sezione script richiesta dal framework Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
            async function letturaJson(){
                const promise=await fetch("28102026.json");
                const catalogo=await promise.json();
                
                let vb=document.querySelector("#viewBox");
                vb.innerHTML="Catalogo Auto usate"+catalogo.length+"<br /><br />";

                for(let i=0; i<catalogo.length; i++){
                    vb.innerHTML+=catalogo[i].marca + " " + catalogo[i].modello + " " + catalogo[i].anno + " " + catalogo[i].provincia + " " + catalogo[i].uniproprietario + " " + catalogo[i].km + "<br />";
                }
            }

            async function caricaListaMaschi(){
                const promise = await fetch("rubrica.json");
                const vettMaschi = await promise.json();
                let vb = document.querySelector("#viewBox");

                vb.innerHTML = "Numero Utenti Totali: "+vettMaschi.length+"<br /><br />";
                for(let i=0; i < vettMaschi.length; i++){
                    if(vettMaschi[i].sesso == "m"){
                        vb.innerHTML += vettMaschi[i].nome + " " + vettMaschi[i].cognome + " " + vettMaschi[i].sesso + " " + vettMaschi[i].anni + " " + vettMaschi[i].paese + "<br />";
                    }
                }
            }

            let Carica = document.querySelector("#CaricaJSON");
            Carica.addEventListener('click', letturaJson);
        </script>
    </body>
</html>
