<!DOCTYPE html>
<html lang="it">
<head>
    <title>Catalogo Giochi</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark text-light">
    <div class="container mt-3">
        <div class="alert alert-success text-center"><h1>Catalogo Giochi</h1></div>
        <div class="container mb-3">
            <div class="row">
                <div class="col-4">
                    <div class="alert alert-primary text-center"><h2>Ricerche<br/>Generiche</h2></div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary" id="btnCaricaArchivio">Carica lista giochi</button>
                    </div>
                </div>
                <div class="col-4">
                    <div class="alert alert-success text-center"><h2>Piattaforma o Estensione</h2></div>
                    <div class="form-group mb-3">
                        <label for="inputPiattaforma" class="form-label">Piattaforma</label>
                        <input class="form-control mb-2" id="inputPiattaforma" type="text" placeholder="es. PS4, Nintendo Switch">
                        <button class="btn btn-success" id="btnCercaPiattaforma">Trova per Piattaforma</button>
                    </div>
                    <div class="form-group">
                        <label for="inputEstensione" class="form-label">Estensione</label>
                        <input class="form-control mb-2" id="inputEstensione" type="text" placeholder="es. PKG, NSP, 3DS">
                        <button class="btn btn-success" id="btnCercaEstensione">Trova per Estensione</button>
                    </div>
                </div>
                <div class="col-4">
                    <div class="alert alert-warning text-center"><h2>Ricerca per Anno di Uscita</h2></div>
                    <div class="form-group">
                        <label for="inputAnnoMinimo" class="form-label">Anno iniziale</label>
                        <input class="form-control mb-2" id="inputAnnoMinimo" type="number" placeholder="es. 2010">
                        <label for="inputAnnoMassimo" class="form-label">Anno finale</label>
                        <input class="form-control" id="inputAnnoMassimo" type="number" placeholder="es. 2026">
                        <button class="btn btn-warning mt-3" id="btnCercaAnno">Giochi nell'Intervallo</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="container" id="viewBox">
            <h3>Usa la UI per sfogliare il catalogo.</h3>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        document.querySelector("#btnCaricaArchivio").addEventListener('click', async function () {
            const promise=await fetch("19112026.json");
            const jsonArr=await promise.json();
            let vb=document.querySelector("#viewBox");
            
            let resultTable = `
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Titolo</th>
                            <th scope="col">Piattaforma</th>
                            <th scope="col">Anno</th>
                            <th scope="col">Peso (GB)</th>
                            <th scope="col">Estensione</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            for (let i=0; i < jsonArr.length; i++) {
                resultTable += '<tr>';
                resultTable += '<th scope="row">'+ (i+1) +'</th>';
                resultTable += '<td>'+jsonArr[i].titolo+'</td>';
                resultTable += '<td>'+jsonArr[i].piattaforma+'</td>';
                resultTable += '<td>'+jsonArr[i].anno+'</td>';
                resultTable += '<td>'+jsonArr[i].peso+' GB</td>';
                resultTable += '<td>'+jsonArr[i].estensione+'</span></td>';
                resultTable += '</tr>';
            }
            resultTable += '</tbody><caption>Giochi totali in archivio: '+jsonArr.length+'</caption></table>';

            vb.innerHTML = resultTable;
        });

        document.querySelector("#btnCercaPiattaforma").addEventListener('click', async function () {
            const promise= await fetch("19112026.json");
            const jsonArr = await promise.json();
            let vb = document.querySelector("#viewBox");
            let piattaformaSrc = document.querySelector("#inputPiattaforma").value;
            let cnt = 0;

            let resultTable = `
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Titolo</th>
                            <th scope="col">Piattaforma</th>
                            <th scope="col">Anno</th>
                            <th scope="col">Peso (GB)</th>
                            <th scope="col">Estensione</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            for (let i = 0; i < jsonArr.length; i++) {
                if (jsonArr[i].piattaforma==piattaformaSrc){
                    resultTable += '<tr>';
                    resultTable += '<th scope="row">'+ (i+1) +'</th>';
                    resultTable += '<td>'+jsonArr[i].titolo+'</td>';
                    resultTable += '<td>'+jsonArr[i].piattaforma+'</td>';
                    resultTable += '<td>'+jsonArr[i].anno+'</td>';
                    resultTable += '<td>'+jsonArr[i].peso+' GB</td>';
                    resultTable += '<td>'+jsonArr[i].estensione+'</span></td>';
                    resultTable += '</tr>';
                    cnt++;
                }
            }
            resultTable+= '</tbody><caption>Giochi trovati: '+cnt+'</caption></table>';

            vb.innerHTML=resultTable;
        });
        document.querySelector("#btnCercaEstensione").addEventListener('click', async function () {
            const promise= await fetch("19112026.json");
            const jsonArr = await promise.json();
            let vb = document.querySelector("#viewBox");
            let estensioneSrc = document.querySelector("#inputEstensione").value;
            let cnt = 0;

            let resultTable = `
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Titolo</th>
                            <th scope="col">Piattaforma</th>
                            <th scope="col">Anno</th>
                            <th scope="col">Peso (GB)</th>
                            <th scope="col">Estensione</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            for (let i = 0; i < jsonArr.length; i++) {
                if (jsonArr[i].estensione===estensioneSrc) {
                    resultTable += '<tr>';
                    resultTable += '<th scope="row">'+ (i+1) +'</th>';
                    resultTable += '<td>'+jsonArr[i].titolo+'</td>';
                    resultTable += '<td>'+jsonArr[i].piattaforma+'</td>';
                    resultTable += '<td>'+jsonArr[i].anno+'</td>';
                    resultTable += '<td>'+jsonArr[i].peso+' GB</td>';
                    resultTable += '<td>'+jsonArr[i].estensione+'</span></td>';
                    resultTable += '</tr>';
                    cnt++;
                }
            }
            resultTable += '</tbody><caption>Giochi trovati: '+cnt+'</caption></table>';

            vb.innerHTML = resultTable;
        });

        document.querySelector("#btnCercaAnno").addEventListener('click', async function(){
            const promise= await fetch("19112026.json");
            const jsonArr = await promise.json();
            let vb = document.querySelector("#viewBox");
            let annoIniziale = parseInt(document.querySelector("#inputAnnoMinimo").value);
            let annoFinale = parseInt(document.querySelector("#inputAnnoMassimo").value);
            let cnt = 0;

            let resultTable = `
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Titolo</th>
                            <th scope="col">Piattaforma</th>
                            <th scope="col">Anno</th>
                            <th scope="col">Peso (GB)</th>
                            <th scope="col">Estensione</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            for (let i = 0; i < jsonArr.length; i++) {
                if (jsonArr[i].anno >= annoIniziale && jsonArr[i].anno <= annoFinale) {
                    resultTable += '<tr>';
                    resultTable += '<th scope="row">'+ (i+1) +'</th>';
                    resultTable += '<td>'+jsonArr[i].titolo+'</td>';
                    resultTable += '<td>'+jsonArr[i].piattaforma+'</td>';
                    resultTable += '<td>'+jsonArr[i].anno+'</td>';
                    resultTable += '<td>'+jsonArr[i].peso+' GB</td>';
                    resultTable += '<td>'+jsonArr[i].estensione+'</span></td>';
                    resultTable += '</tr>';
                    cnt++;
                }
            }
            resultTable += '</tbody><caption>Giochi trovati: '+cnt+'</caption></table>';

            vb.innerHTML = resultTable;
        });
    </script>
</body>
</html>
