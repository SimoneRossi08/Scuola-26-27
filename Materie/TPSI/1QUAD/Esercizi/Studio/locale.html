<!DOCTYPE html>
<!--
Esercitazione proposta

Crea un file di archivio JSON per catalogare ipotetici immobili messi in vendita da un'agenzia immobiliare. Ogni immobile è archiviato secondo le seguenti chiavi:
- Tipologia (Appartamento, Villa, Monolocale, ecc.)
- Indirizzo
- Città
- Provincia
- Superficie (m²)
- Numero di Locali
- Prezzo (€)
- Disponibile (booleano)

Una volta creato un archivio con una decina di immobili, con dati diversi ed inventati, procedere alla creazione di una pagina HTML che grazie a funzioni Javascript permetta le seguenti operazioni:
- Visualizzazione dell'intero archivio.
- Visualizzazione degli immobili attualmente disponibili.
- Ricerca e visualizzazione degli immobili secondo la città.
- Ricerca e visualizzazione degli immobili secondo la tipologia.
- Ricerca e visualizzazione degli immobili con una superficie compresa tra superficie_min e superficie_max.
- Ricerca e visualizzazione degli immobili con un prezzo inferiore o uguale a un valore massimo indicato.
- Ricerca e visualizzazione degli immobili con un numero di locali specifico.

Predisporre un'interfaccia grafica con bottoni e caselle di testo, indicando quali valori richiedono e a cosa servono.

Applicare il framework Bootstrap dall'inizio o, eventualmente, sviluppare una versione funzionante base e applicarlo in un secondo momento su una copia/duplicato della versione di base.
-->

                            </thead>
